[workspace]
resolver = "2"
members = ["substrate", "substrate/wrapper"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
md-5 = "0.11"
thiserror = "2"
tempfile = "3"
dashmap = "6"
uuid = { version = "1", features = ["v4"] }
notify = { version = "8", features = ["macos_fsevent"] }
reqwest = { version = "0.13", features = ["stream", "rustls"] }
quick-xml = "0.40"
nix = { version = "0.31", features = ["signal", "process"] }
libc = "0.2"
criterion = { version = "0.8", features = ["html_reports"] }
tower = "0.5"
hex = "0.4"

[profile.dev]
# Keep local builds debuggable while cutting target/ hard.
# Most of debug/ bulk is dep debuginfo + incremental caches.
debug = 1
incremental = false
split-debuginfo = "unpacked"

[profile.dev.package."*"]
# Dependency crates almost never need local debug symbols.
debug = false
opt-level = 1

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
incremental = false
debug = false

[profile.release.package."*"]
debug = false

[profile.test]
opt-level = 1
debug = 0
lto = false
incremental = false

[profile.bench]
incremental = false
debug = false
strip = true
lto = true
codegen-units = 1
