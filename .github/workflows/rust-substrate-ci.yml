name: Rust Substrate CI

on:
  push:
    branches: [rust-substrate, master]
    paths:
      - 'substrate/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'testing/dogfood/**'
      - 'tools/dogfood_runner/**'
      - 'tools/ci/**'
      - 'platforms/core-execution/rust-bridge/**'
      - 'docs/STATUS.md'
      - '.github/workflows/rust-substrate-ci.yml'
  pull_request:
    branches: [rust-substrate, master]
    paths:
      - 'substrate/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'testing/dogfood/**'
      - 'tools/dogfood_runner/**'
      - 'tools/ci/**'
      - 'platforms/core-execution/rust-bridge/**'
      - 'docs/STATUS.md'
      - '.github/workflows/rust-substrate-ci.yml'
  schedule:
    # Run daily at midnight to catch any issues
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      require_dogfood:
        description: 'Fail if Gradle-under-test is missing or dogfood summary is not full pass'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

jobs:
  test-linux:
    name: "Test (Linux)"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check compilation
        run: cargo check --verbose

      # Prefer keeping clippy; allow dead_code so WIP shards do not fail -D warnings.
      - name: Clippy (deny warnings except dead_code)
        run: cargo clippy -- -D warnings -A dead_code

      - name: Run all unit tests
        run: cargo test --lib --verbose

      - name: Full package tests + substrate gates
        env:
          # Default off: dogfood needs build/gradle-under-test (heavy). Gates still
          # run cargo test/build full package; dogfood executes only when under-test
          # is present (see tools/ci/run_rust_substrate_gates.sh).
          CI_REQUIRE_DOGFOOD: "0"
        run: bash tools/ci/run_rust_substrate_gates.sh

      - name: Run parser regression tests
        run: cargo test --test parser_regression --verbose

      - name: Run integration tests
        run: cargo test --test integration_test --verbose

      - name: Run differential tests
        run: cargo test --test differential_test --verbose

      - name: Run hash differential tests
        run: cargo test --test differential --verbose

      - name: Run benchmarks
        run: cargo test --test benchmarks --verbose

      - name: Run fuzz tests
        run: cargo test --test parser_fuzz --verbose

  test-macos:
    name: "Test (macOS)"
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check compilation
        run: cargo check --verbose

      - name: Clippy (deny warnings except dead_code)
        run: cargo clippy -- -D warnings -A dead_code

      - name: Run all unit tests
        run: cargo test --lib --verbose

      - name: Run full test suite
        run: cargo test --verbose

  # Optional dogfood job.
  # Runs on workflow_dispatch/schedule always; on push/PR only when dogfood,
  # dogfood_runner, tools/ci, or rust-bridge paths change (git diff filter).
  # CI_REQUIRE_DOGFOOD=1 only when under-test is already present — CI does not
  # build distributions-full:install by default (too heavy). Dogfood therefore
  # runs when under-test is present; otherwise the job documents the skip.
  dogfood:
    name: "Direct-warm dogfood"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect dogfood-related path changes
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event_name }}" == "schedule" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          HEAD="${{ github.event.pull_request.head.sha || github.sha }}"
          if [[ -z "${BASE}" || "${BASE}" == "0000000000000000000000000000000000000000" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" "$HEAD" 2>/dev/null | grep -E '^(testing/dogfood/|tools/dogfood_runner/|tools/ci/|platforms/core-execution/rust-bridge/)' >/dev/null; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No dogfood/bridge/ci path changes; dogfood job will no-op."
          fi

      - name: Setup Rust
        if: steps.paths.outputs.relevant == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        if: steps.paths.outputs.relevant == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-dogfood-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-dogfood-
            ${{ runner.os }}-cargo-

      - name: Setup Java
        if: steps.paths.outputs.relevant == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check for Gradle-under-test
        if: steps.paths.outputs.relevant == 'true'
        id: under_test
        shell: bash
        run: |
          if [[ -n "${GRADLE_UNDER_TEST_BIN:-}" && -x "${GRADLE_UNDER_TEST_BIN}" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Using GRADLE_UNDER_TEST_BIN=${GRADLE_UNDER_TEST_BIN}"
          elif [[ -n "${GRADLE_UNDER_TEST:-}" && -x "${GRADLE_UNDER_TEST%/}/bin/gradle" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Using GRADLE_UNDER_TEST=${GRADLE_UNDER_TEST}"
          elif [[ -x build/gradle-under-test/bin/gradle ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Using build/gradle-under-test/bin/gradle"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Gradle-under-test not present."
            echo "Dogfood runs when under-test is present (build/gradle-under-test or GRADLE_UNDER_TEST*)."
            echo "Install locally via tools/install_gradle_under_test.sh; CI does not build the full distribution by default."
          fi

      - name: Substrate gates with optional dogfood
        if: steps.paths.outputs.relevant == 'true'
        env:
          # Require dogfood only when under-test is already available, or when
          # workflow_dispatch explicitly requested require_dogfood=true.
          CI_REQUIRE_DOGFOOD: ${{ (steps.under_test.outputs.present == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.require_dogfood == 'true')) && '1' || '0' }}
        run: bash tools/ci/run_rust_substrate_gates.sh

      - name: Upload dogfood artifacts
        if: steps.paths.outputs.relevant == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-direct-warm
          path: build/ci-direct-warm/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Dogfood path filter skip notice
        if: steps.paths.outputs.relevant != 'true'
        run: echo "Skipped dogfood (paths not in testing/dogfood, tools/dogfood_runner, tools/ci, rust-bridge)."

  release-build:
    name: "Release Build (all platforms)"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: gradle-substrate-daemon-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: gradle-substrate-daemon-macos-aarch64
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: gradle-substrate-daemon-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: gradle-substrate-daemon-windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} -p gradle-substrate-daemon

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/gradle-substrate-daemon*
          retention-days: 30

      - name: Check binary size (< 10 MB)
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            size=$(du -b target/${{ matrix.target }}/release/gradle-substrate-daemon.exe | cut -f1)
          else
            size=$(du -b target/${{ matrix.target }}/release/gradle-substrate-daemon | cut -f1)
          fi
          echo "Binary size: $size bytes ($(( size / 1024 )) KB)"
          if [ "$size" -gt 10485760 ]; then
            echo "FAIL: Binary exceeds 10 MB limit"
            exit 1
          fi
